<!DOCTYPE html>
<html lang="pt-br">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Parallax CSS</title>
  <style>
    body, html {
      margin: 0;
      padding: 0;
      font-family: sans-serif;
    }

    .parallax {
      background-image: url(imagens/pattern002.png);
      height: 500px;
      background-attachment: fixed;
      background-position: center;
    }

    .parallaxx {
      background-image: url(imagens/pattern003.png);
      height: 500px;
      background-attachment: fixed;
      background-position: center;
    }

    .conteudo {
      height: 300px;
      background-color: white;
      padding: 20px;
      text-align: center;
    }
  </style>
</head>
<body>

  <div class="parallax"></div>

  <div class="conteudo">
    <h1>Conteúdo</h1>
    <p>Este é um exemplo de efeito parallax feito só com CSS.</p>
  </div>

  <div class="parallaxx"></div>

  <div class="conteudo">
    <h1>Mais conteúdo</h1>
    <p>Você pode repetir o efeito quantas vezes quiser.</p>
  </div>

</body>
</html>
